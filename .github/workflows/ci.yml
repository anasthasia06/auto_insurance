name: CI pipeline

on:
  push:
    branches: [ "wissal", "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Run Linting
        run: |
          uv run python -m ruff check auto_insurance/
          uv run python -m pylint auto_insurance/src/ --disable=C0114,C0116
          uv run python -m mypy auto_insurance/src/

      - name: Run Tests
        run: uv run --with httpx python -m pytest tests/ -v