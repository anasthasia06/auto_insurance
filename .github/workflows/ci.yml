name: CI pipeline
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]
jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: "3.10" }
    - run: pip install uv
    - run: uv sync
    - run: |
        uv run python -m ruff check auto_insurance/
        uv run python -m pylint auto_insurance/src/
        uv run python -m mypy auto_insurance/src/
    - run: uv run python -m pytest tests/ -v
